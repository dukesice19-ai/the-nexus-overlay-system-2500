name: Deploy The Nexus to Vercel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Static Bundle & Vercel Manifest
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f data.js
          test -f vercel.json
          echo "Verified all core Nexus Overlay System files."

      - name: Deploy to Vercel Production (if VERCEL_TOKEN is configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret not set; skipping CLI deploy (use Vercel GitHub App integration or set VERCEL_TOKEN)."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
